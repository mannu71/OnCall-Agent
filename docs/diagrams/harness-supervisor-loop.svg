<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Supervisor loop verdicts</title>
<desc>The agent runs under hard bounds, a supervisor scores the answer, and the verdict is pass, retry with new guidance, human-in-the-loop pause, or escalate.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.note{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red rect{fill:#FCEBEB;stroke:#A32D2D}.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
</style>
</defs>

<g class="c-purple">
  <rect x="220" y="20" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Run agent</text>
  <text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">LLM + tool iterations</text>
</g>
<g class="c-gray">
  <rect x="490" y="20" width="150" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="th" x="565" y="38" text-anchor="middle" dominant-baseline="central">Hard bounds</text>
  <text class="ts" x="565" y="56" text-anchor="middle" dominant-baseline="central">iters, clock, tokens</text>
</g>
<line x1="460" y1="48" x2="488" y2="48" class="leader"/>
<line x1="340" y1="76" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="220" y="112" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">Supervisor verdict</text>
  <text class="ts" x="340" y="148" text-anchor="middle" dominant-baseline="central">score the final answer</text>
</g>

<line x1="260" y1="168" x2="112" y2="236" class="arr" marker-end="url(#arrow)"/>
<line x1="310" y1="168" x2="266" y2="236" class="arr" marker-end="url(#arrow)"/>
<line x1="370" y1="168" x2="418" y2="236" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="168" x2="570" y2="236" class="arr" marker-end="url(#arrow)"/>

<g class="c-green">
  <rect x="42" y="240" width="136" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="110" y="258" text-anchor="middle" dominant-baseline="central">Pass</text>
  <text class="ts" x="110" y="276" text-anchor="middle" dominant-baseline="central">return result</text>
</g>
<g class="c-amber">
  <rect x="196" y="240" width="136" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="264" y="258" text-anchor="middle" dominant-baseline="central">Retry</text>
  <text class="ts" x="264" y="276" text-anchor="middle" dominant-baseline="central">new guidance</text>
</g>
<g class="c-blue">
  <rect x="350" y="240" width="136" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="418" y="258" text-anchor="middle" dominant-baseline="central">HITL</text>
  <text class="ts" x="418" y="276" text-anchor="middle" dominant-baseline="central">engineer review</text>
</g>
<g class="c-red">
  <rect x="504" y="240" width="136" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="572" y="258" text-anchor="middle" dominant-baseline="central">Escalate</text>
  <text class="ts" x="572" y="276" text-anchor="middle" dominant-baseline="central">flag + stop</text>
</g>
<text class="ts note" x="264" y="320" text-anchor="middle">&#8635; rebuilds agent, loops back to run</text>
</svg>
