<svg width="100%" viewBox="0 0 680 668" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Agent harness build pipeline</title>
<desc>Workflow node config flows through spec factory, context builder, tool assembler with STS pre-flight, tool router, and permission wrap to produce a LangGraph ReAct agent with extension tools.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.box rect{fill:#F1EFE8;stroke:#B4B2A9}.box .th{fill:#444441}.box .ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
</style>
</defs>

<g class="box">
  <rect x="180" y="20" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="300" y="38" text-anchor="middle" dominant-baseline="central">Workflow node config</text>
  <text class="ts" x="300" y="56" text-anchor="middle" dominant-baseline="central">agent, tools, logs, code</text>
</g>
<line x1="300" y1="76" x2="300" y2="110" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="180" y="112" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="300" y="130" text-anchor="middle" dominant-baseline="central">Spec factory</text>
  <text class="ts" x="300" y="148" text-anchor="middle" dominant-baseline="central">declarative AgentSpec</text>
</g>
<line x1="300" y1="168" x2="300" y2="202" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="180" y="204" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="300" y="222" text-anchor="middle" dominant-baseline="central">Context builder</text>
  <text class="ts" x="300" y="240" text-anchor="middle" dominant-baseline="central">KB recall, seeded analysis</text>
</g>
<line x1="300" y1="260" x2="300" y2="294" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="180" y="296" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="300" y="314" text-anchor="middle" dominant-baseline="central">Tool assembler</text>
  <text class="ts" x="300" y="332" text-anchor="middle" dominant-baseline="central">MCP, CloudWatch, code, DB</text>
</g>
<g class="c-amber">
  <rect x="470" y="296" width="170" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="314" text-anchor="middle" dominant-baseline="central">STS pre-flight</text>
  <text class="ts" x="555" y="332" text-anchor="middle" dominant-baseline="central">abort if expired</text>
</g>
<line x1="420" y1="324" x2="468" y2="324" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="352" x2="300" y2="386" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="180" y="388" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="300" y="406" text-anchor="middle" dominant-baseline="central">Tool router</text>
  <text class="ts" x="300" y="424" text-anchor="middle" dominant-baseline="central">top-K relevance prune</text>
</g>
<line x1="300" y1="444" x2="300" y2="478" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="180" y="480" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="300" y="498" text-anchor="middle" dominant-baseline="central">Permission wrap</text>
  <text class="ts" x="300" y="516" text-anchor="middle" dominant-baseline="central">allow / ask / deny + caps</text>
</g>
<line x1="300" y1="536" x2="300" y2="570" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="180" y="572" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="300" y="590" text-anchor="middle" dominant-baseline="central">LangGraph ReAct agent</text>
  <text class="ts" x="300" y="608" text-anchor="middle" dominant-baseline="central">bound tools + prompt</text>
</g>
<g class="c-amber">
  <rect x="470" y="572" width="170" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="590" text-anchor="middle" dominant-baseline="central">Extension tools</text>
  <text class="ts" x="555" y="608" text-anchor="middle" dominant-baseline="central">subagent, gated edit</text>
</g>
<line x1="468" y1="600" x2="422" y2="600" class="arr" marker-end="url(#arrow)"/>
</svg>
