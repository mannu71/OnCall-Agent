<svg width="100%" viewBox="0 0 680 490" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Workflow execution flow</title>
<desc>A run trigger flows through the workflow executor into the agent harness supervisor loop, which iterates with AWS Bedrock and routes tool calls through the tool router to the code crawler, log watch, and MCP tools.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.box rect{fill:#F1EFE8;stroke:#B4B2A9}.box .th{fill:#444441}.box .ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
</style>
</defs>

<g class="box">
  <rect x="250" y="20" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Run trigger</text>
  <text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">UI, scheduler, jobs</text>
</g>
<line x1="340" y1="76" x2="340" y2="112" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="220" y="114" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="132" text-anchor="middle" dominant-baseline="central">Workflow executor</text>
  <text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">graph + node configs</text>
</g>
<line x1="340" y1="170" x2="340" y2="206" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="220" y="208" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="226" text-anchor="middle" dominant-baseline="central">Agent harness</text>
  <text class="ts" x="340" y="244" text-anchor="middle" dominant-baseline="central">supervisor loop</text>
</g>
<g class="c-coral">
  <rect x="510" y="208" width="130" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="575" y="226" text-anchor="middle" dominant-baseline="central">AWS Bedrock</text>
  <text class="ts" x="575" y="244" text-anchor="middle" dominant-baseline="central">Claude</text>
</g>
<line x1="462" y1="226" x2="508" y2="226" class="arr" marker-end="url(#arrow)"/>
<line x1="508" y1="246" x2="462" y2="246" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="264" x2="340" y2="300" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="220" y="302" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="320" text-anchor="middle" dominant-baseline="central">Tool router</text>
  <text class="ts" x="340" y="338" text-anchor="middle" dominant-baseline="central">permission gates</text>
</g>
<line x1="260" y1="358" x2="148" y2="392" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="358" x2="340" y2="392" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="358" x2="532" y2="392" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="60" y="394" width="176" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="148" y="412" text-anchor="middle" dominant-baseline="central">Code crawler</text>
  <text class="ts" x="148" y="430" text-anchor="middle" dominant-baseline="central">repo search</text>
</g>
<g class="c-teal">
  <rect x="252" y="394" width="176" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="412" text-anchor="middle" dominant-baseline="central">Log watch</text>
  <text class="ts" x="340" y="430" text-anchor="middle" dominant-baseline="central">CloudWatch queries</text>
</g>
<g class="c-teal">
  <rect x="444" y="394" width="176" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="532" y="412" text-anchor="middle" dominant-baseline="central">MCP tools</text>
  <text class="ts" x="532" y="430" text-anchor="middle" dominant-baseline="central">external servers</text>
</g>
</svg>
