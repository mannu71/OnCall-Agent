<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg">
<title>System architecture overview</title>
<desc>React UI talks to a FastAPI backend in Docker containing API, workflow engine, agent harness, crawler, and core runtime; backed by PostgreSQL with pgvector and a mounted repos volume, integrating with AWS Bedrock, CloudWatch, Azure DevOps, and MCP servers.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px}.ts{font-size:12px}.th{font-size:14px;font-weight:500}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.legend{fill:#444441}
</style>
</defs>

<g class="c-purple">
  <rect x="130" y="20" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="250" y="38" text-anchor="middle" dominant-baseline="central">React UI</text>
  <text class="ts" x="250" y="56" text-anchor="middle" dominant-baseline="central">Vite + Electron desktop</text>
</g>
<line x1="250" y1="76" x2="250" y2="116" class="arr" marker-end="url(#arrow)"/>
<text class="ts legend" x="262" y="96" text-anchor="start">REST / SSE</text>

<g class="c-gray">
  <rect x="40" y="120" width="420" height="262" rx="20" stroke-width="0.5"/>
  <text class="th" x="250" y="146" text-anchor="middle">agent-api (FastAPI, Docker)</text>
</g>
<g class="c-purple">
  <rect x="60" y="162" width="380" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="250" y="180" text-anchor="middle" dominant-baseline="central">API v1 layer</text>
  <text class="ts" x="250" y="198" text-anchor="middle" dominant-baseline="central">workflows, executions, jobs, gateway</text>
</g>
<g class="c-purple">
  <rect x="60" y="234" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="152" y="252" text-anchor="middle" dominant-baseline="central">Workflow engine</text>
  <text class="ts" x="152" y="270" text-anchor="middle" dominant-baseline="central">visual node executor</text>
</g>
<g class="c-purple">
  <rect x="256" y="234" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="348" y="252" text-anchor="middle" dominant-baseline="central">Agent harness</text>
  <text class="ts" x="348" y="270" text-anchor="middle" dominant-baseline="central">tools, permissions</text>
</g>
<g class="c-purple">
  <rect x="60" y="306" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="152" y="324" text-anchor="middle" dominant-baseline="central">Code crawler</text>
  <text class="ts" x="152" y="342" text-anchor="middle" dominant-baseline="central">indexer, KG search</text>
</g>
<g class="c-purple">
  <rect x="256" y="306" width="184" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="348" y="324" text-anchor="middle" dominant-baseline="central">Core runtime</text>
  <text class="ts" x="348" y="342" text-anchor="middle" dominant-baseline="central">scheduler, transport</text>
</g>

<g class="c-coral">
  <rect x="500" y="132" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="570" y="150" text-anchor="middle" dominant-baseline="central">AWS Bedrock</text>
  <text class="ts" x="570" y="168" text-anchor="middle" dominant-baseline="central">Claude models</text>
</g>
<g class="c-coral">
  <rect x="500" y="204" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="570" y="222" text-anchor="middle" dominant-baseline="central">CloudWatch</text>
  <text class="ts" x="570" y="240" text-anchor="middle" dominant-baseline="central">log groups</text>
</g>
<g class="c-coral">
  <rect x="500" y="276" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="570" y="294" text-anchor="middle" dominant-baseline="central">Azure DevOps</text>
  <text class="ts" x="570" y="312" text-anchor="middle" dominant-baseline="central">repos, wikis</text>
</g>
<g class="c-coral">
  <rect x="500" y="348" width="140" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="570" y="366" text-anchor="middle" dominant-baseline="central">MCP servers</text>
  <text class="ts" x="570" y="384" text-anchor="middle" dominant-baseline="central">external tools</text>
</g>
<line x1="462" y1="160" x2="498" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="462" y1="232" x2="498" y2="232" class="arr" marker-end="url(#arrow)"/>
<line x1="462" y1="304" x2="498" y2="304" class="arr" marker-end="url(#arrow)"/>
<line x1="462" y1="376" x2="498" y2="376" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="60" y="424" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="160" y="442" text-anchor="middle" dominant-baseline="central">PostgreSQL 16</text>
  <text class="ts" x="160" y="460" text-anchor="middle" dominant-baseline="central">pgvector, jobs, locks</text>
</g>
<g class="c-teal">
  <rect x="290" y="424" width="170" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="375" y="442" text-anchor="middle" dominant-baseline="central">Repos volume</text>
  <text class="ts" x="375" y="460" text-anchor="middle" dominant-baseline="central">host mount (rw)</text>
</g>
<line x1="160" y1="382" x2="160" y2="422" class="arr" marker-end="url(#arrow)"/>
<line x1="375" y1="382" x2="375" y2="422" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="60" y="506" width="12" height="12" rx="3"/></g>
<text class="ts legend" x="80" y="512" dominant-baseline="central">application code</text>
<g class="c-teal"><rect x="200" y="506" width="12" height="12" rx="3"/></g>
<text class="ts legend" x="220" y="512" dominant-baseline="central">storage</text>
<g class="c-coral"><rect x="300" y="506" width="12" height="12" rx="3"/></g>
<text class="ts legend" x="320" y="512" dominant-baseline="central">external services</text>
</svg>
