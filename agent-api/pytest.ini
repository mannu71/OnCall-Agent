[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Eval suite (P3 §2.8) costs real LLM tokens — exclude from default runs.
# Invoke explicitly with: pytest -m eval
markers =
    eval: golden-trace accuracy / token-budget regression suite
addopts = -m "not eval"
