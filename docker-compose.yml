name: oncall-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kyc-agent-db
    environment:
      POSTGRES_USER: kycuser
      POSTGRES_PASSWORD: kycpassword
      POSTGRES_DB: kycagent
    ports:
      # Host port defaults to an uncommon value to avoid clashing with a local
      # Postgres. Override POSTGRES_HOST_PORT in .env if 45432 is taken.
      - "${POSTGRES_HOST_PORT:-45432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kycuser -d kycagent" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - oncall-agent

  agent-api:
    build:
      context: .
      dockerfile: agent-api/Dockerfile
      args:
        # Forwarded to the build so pip can reach the index through a corporate
        # proxy. Empty by default (no-op); set these in .env on locked-down
        # machines. Docker Desktop's own proxy settings also work.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: kyc-agent-api
    ports:
      # Override API_HOST_PORT in .env if 48000 is taken.
      - "${API_HOST_PORT:-48000}:8000"
    volumes:
      - ./agent-api/data:/app/data
      - ~/.aws:/root/.aws:ro
      - ${REPOS_HOST_PATH:-./agent-api/data/indexed_repos}:/app/data/indexed_repos
      - ./agent-api/data/codegraph-cache:/root/.cache/codegraph
      # Corporate TLS-inspecting proxy (e.g. Netskope) CA bundle. Read-only.
      # Defaults to /dev/null when NETSKOPE_CERT_PATH is unset, so this mount is
      # a harmless no-op on machines without an SSL-inspecting proxy.
      - ${NETSKOPE_CERT_PATH:-/dev/null}:/etc/ssl/certs/corp-ca.pem:ro
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SCHEDULER_TIMEZONE=UTC
      - MAX_CONCURRENT_WORKFLOWS=5
      - LOG_LEVEL=INFO
      - AWS_SSL_VERIFY=false
      # Point boto3, requests, and stdlib ssl at the corporate CA bundle so the
      # CloudWatch MCP subprocess (a separate process that ignores AWS_SSL_VERIFY)
      # trusts the proxy-re-signed chain. The bundle is a full combined chain
      # (corporate + public roots), so this is proper verification, not a bypass.
      # `:+` expands to empty when NETSKOPE_CERT_PATH is unset -> libraries fall
      # back to their default CA store on non-corporate machines.
      - AWS_CA_BUNDLE=${NETSKOPE_CERT_PATH:+/etc/ssl/certs/corp-ca.pem}
      - REQUESTS_CA_BUNDLE=${NETSKOPE_CERT_PATH:+/etc/ssl/certs/corp-ca.pem}
      - SSL_CERT_FILE=${NETSKOPE_CERT_PATH:+/etc/ssl/certs/corp-ca.pem}
      - NODE_EXTRA_CA_CERTS=${NETSKOPE_CERT_PATH:+/etc/ssl/certs/corp-ca.pem}
      - DATABASE_URL=postgresql://kycuser:kycpassword@postgres:5432/kycagent
      - REPOS_BASE_PATH=/app/data/indexed_repos
      - CODEGRAPH_CACHE_DIR=/root/.cache/codegraph
      # Per-call cap for the slow search_code grep. Kept well under the delegated
      # subagent budget (240s) so one slow grep can't time out a code-db
      # investigation before it falls back to the fast indexed tools.
      - CODEGRAPH_SEARCH_TIMEOUT=45
      # 256MB — up from the 64MB engine default (cg_store_resolve_mmap_size,
      # store.c:308) so the whole ~100MB compliance-api store fits in the
      # mmap window for cold reads. Cheap, safe: just raises a read-cache
      # ceiling, no schema/index/query changes.
      - CG_SQLITE_MMAP_SIZE=268435456
      - PROVIDER_TRANSPORT=bedrock
      - COMPRESSION_ENABLED=true
      - COMPRESSION_ENDPOINT=http://headroom:8787
      # Sub-2KB outputs gain little from compression but pay sidecar latency
      # on every call, so only compress meaningfully large results.
      - COMPRESSION_MIN_CHARS=2000
      - COMPRESSION_TIMEOUT_MS=2000
      # Extend compression past the MCP adapter to the native tool families
      # (CloudWatch, db, repo file tools), which previously reached the sidecar
      # never and carry a 16000-char cap — double the MCP path's 8000. Measured
      # 2026-07-23 against the live sidecar, those are exactly the shapes that
      # compress: raw log lines 98%, db result sets 52%, CloudWatch event JSON
      # 31%. Failure is a byte-identical fallback to the plain cap, so the only
      # cost of being wrong is sidecar latency.
      - COMPRESSION_ALL_TOOLS=true
    # Resource caps. Local inference (app/core/mini) sizes its threads from the
    # cgroup quota, so a CPU cap here also keeps the API event loop responsive.
    # AGENT_API_CPUS=0 means no CPU cap (the default, so small Docker Desktop
    # VMs still start); set it to e.g. 4 on shared hosts. The memory cap only
    # bounds the container; on Docker Desktop the WSL2 VM (.wslconfig) is the
    # real ceiling.
    cpus: ${AGENT_API_CPUS:-0}
    mem_limit: ${AGENT_API_MEMORY:-8g}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - oncall-agent

  headroom:
    # Pinned by digest (was :latest) so the compression sidecar can't drift
    # under us. Bump deliberately after re-verifying the A/B token savings.
    image: ghcr.io/chopratejas/headroom@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c
    container_name: kyc-agent-headroom
    command: ["--port", "8787"]
    environment:
      # CCR ("content reference") replaces spans with opaque <ccr:hash,...>
      # handles and returns only the hash LIST — there is no resolution map in
      # the /v1/compress response, so a handle that reaches the model can never
      # be dereferenced. app/core/context/tool_output.py therefore discards any
      # CCR-marked result and falls back to the original text, which meant
      # compression saved NOTHING on exactly the large outputs it exists for
      # (measured 2026-07-23: the 32K/28K/24K/23K/17K/16K-char MCP results all
      # discarded). Disabling the markers keeps every non-CCR transform — the
      # ones that actually pay: ~38% on JSON, ~97% on log lines.
      - HEADROOM_NO_CCR_MARKER=1
      # Belt and braces: we never expose headroom's retrieve tool to the model.
      - HEADROOM_NO_CCR_INJECT_TOOL=1
    ports:
      # Loopback-only. Override HEADROOM_HOST_PORT in .env if 48787 is taken.
      - "127.0.0.1:${HEADROOM_HOST_PORT:-48787}:8787"
    # Override the image's baked-in probe, which hits /readyz. That endpoint
    # 503s unless headroom can reach https://api.anthropic.com — an upstream we
    # never use (Bedrock-only) and which fails under corporate TLS interception
    # anyway. We use headroom purely as a local compression sidecar over
    # /v1/compress (COMPRESSION_ENDPOINT), so /livez is the signal that actually
    # matches our dependency: process up and serving. Keeps a red status
    # meaningful instead of permanently red.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/livez"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - oncall-agent

  ui:
    # Streamlit UI (streamlit-ui/). It calls agent-api server-side over the
    # compose network, so there is no nginx /api proxy any more. The previous
    # React UI still lives in ui/ until the Streamlit port is signed off.
    build:
      context: ./streamlit-ui
      dockerfile: Dockerfile
      args:
        # Forwarded so pip can reach the index through a corporate proxy.
        # Empty by default (no-op); set in .env on locked-down machines.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: kyc-agent-ui
    environment:
      - AGENT_API_URL=http://agent-api:8000
      # Set when agent-api runs with API_AUTH_ENABLED=true.
      - AGENT_API_KEY=${AGENT_API_KEY:-}
    ports:
      # Override UI_HOST_PORT in .env if 43000 is taken.
      - "${UI_HOST_PORT:-43000}:8501"
    depends_on:
      - agent-api
    restart: unless-stopped
    networks:
      - oncall-agent

networks:
  oncall-agent:
    name: oncall-agent
    driver: bridge

volumes:
  postgres_data:
    name: oncall-agent-postgres-data
