name: oncall-agent-ui

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Forwarded so `npm ci` can reach the registry through a corporate proxy.
        # Empty by default (no-op); set in .env on locked-down machines.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: kyc-agent-ui
    ports:
      # Override UI_HOST_PORT in .env if 43000 is taken.
      - "${UI_HOST_PORT:-43000}:80"
    restart: unless-stopped
    networks:
      - oncall-agent

networks:
  oncall-agent:
    external: true
    name: oncall-agent
